<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Školní Výzva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card-flip { perspective: 1000px; }
    .card-inner { transition: transform 0.4s; transform-style: preserve-3d; }
    .card-flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; }
    .card-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-6 font-sans">
  <div class="max-w-2xl mx-auto space-y-4">

    <!-- Horní lišta s XP -->
    <header class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center shadow-lg">
      <div class="flex items-center gap-3">
        <span class="text-2xl">⚡</span>
        <div>
          <h1 class="text-base font-bold text-amber-400 leading-tight">Školní Výzva</h1>
          <p id="playerLevel" class="text-xs text-slate-400">Level 1 • Začátečník</p>
        </div>
      </div>
      <div class="bg-slate-950 px-3 py-1 rounded-xl border border-slate-700 flex items-center gap-1.5">
        <span class="text-xs text-amber-400 font-black">XP</span>
        <span id="xpDisplay" class="text-sm font-bold text-white">0</span>
      </div>
    </header>

    <!-- Navigační záložky -->
    <nav class="grid grid-cols-3 gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800 text-xs font-semibold">
      <button id="tabBtn-game" onclick="switchTab('game')" class="py-2.5 rounded-lg bg-amber-500 text-slate-950 font-bold transition">🎮 Herní zóna</button>
      <button id="tabBtn-upload" onclick="switchTab('upload')" class="py-2.5 rounded-lg text-slate-400 hover:text-white transition">📸 Nahrát látku</button>
      <button id="tabBtn-parent" onclick="switchTab('parent')" class="py-2.5 rounded-lg text-slate-400 hover:text-white transition">👩‍👦 Pro mamku</button>
    </nav>

    <!-- 1. HERNÍ ZÓNA -->
    <section id="sec-game" class="space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">1. Předmět:</label>
            <select id="filterSubjectSelect" onchange="filterLessonsBySubject()" class="bg-slate-950 border border-slate-700 text-xs rounded-lg px-3 py-2 text-slate-200 outline-none w-full focus:border-amber-400">
              <option value="ALL">Všechny předměty</option>
              <option value="Dějepis">Dějepis</option>
              <option value="Fyzika">Fyzika</option>
              <option value="Přírodopis">Přírodopis</option>
              <option value="Zeměpis">Zeměpis</option>
              <option value="Český jazyk">Český jazyk</option>
              <option value="Matematika">Matematika</option>
              <option value="Chemie">Chemie</option>
              <option value="Anglický jazyk">Anglický jazyk</option>
              <option value="Německý jazyk">Německý jazyk</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">2. Téma / Látka:</label>
            <select id="lessonSelect" onchange="onSelectLessonChange()" class="bg-slate-950 border border-slate-700 text-xs rounded-lg px-3 py-2 text-slate-200 outline-none w-full focus:border-amber-400">
            </select>
          </div>
        </div>
      </div>

      <div class="bg-slate-800/90 backdrop-blur p-3 rounded-xl border border-slate-700 flex justify-between items-center">
        <div class="flex items-center gap-1.5">
          <span class="text-xs text-slate-400">Životy:</span>
          <span id="livesDisplay" class="text-sm tracking-wider">❤️❤️❤️</span>
        </div>
        <div id="gameSubjectBadge" class="text-xs font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">Dějepis</div>
      </div>

      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-2">
        <h2 id="lessonTitle" class="text-lg font-bold text-amber-400">Doba bronzová a železná</h2>
        <p id="lessonSummary" class="text-xs md:text-sm text-slate-300 leading-relaxed"></p>
      </div>

      <div class="space-y-2">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Klíčové pojmy (klikni pro otočení)</h3>
        <div id="flashcardsBox" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5"></div>
      </div>

      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold text-white uppercase tracking-wider">Kvízový souboj</h3>
          <span id="quizCounter" class="text-xs text-slate-400">Otázka 1 / 3</span>
        </div>
        <div id="quizBox" class="space-y-3"></div>
      </div>
    </section>

    <!-- 2. NAHRÁT LÁTKU -->
    <section id="sec-upload" class="hidden space-y-4">
      <div class="bg-slate-800 p-6 rounded
